name: ✅ CI — Validate

# NOTA: deploys de produção NÃO acontecem neste workflow.
#   • Backend  → integração nativa do Railway (railway.toml + Dockerfile,
#                serviço su-production-4561; auto-deploy no push para main).
#   • Frontend → workflow deploy-frontend-auto.yml (vercel --prod no push para main).
#   • Previews de PR → integrações nativas Railway/Vercel (bots comentam no PR).
# Este workflow é somente validação: type check + lint + build + testes.
#
# Histórico: o antigo job "deploy-railway" rodava `projectCreate` e criava um
# projeto Railway novo ("afj-core") a cada push — nunca deployava no serviço de
# produção. O "deploy-vercel" fazia `vercel --prod` até de branches de PR
# (deploy acidental em produção) e era redundante com deploy-frontend-auto.yml.
# Ambos foram removidos.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/deploy.yml'
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/deploy.yml'

jobs:
  validate:
    name: Validate — Type Check + Lint + Build
    runs-on: ubuntu-latest
    # Postgres real para os testes de backend. Antes deste passo a suíte
    # sequer era coletada no CI (ver nota no passo "Backend tests"), então
    # nenhum serviço era necessário — e nenhum teste rodava.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: afj
          POSTGRES_PASSWORD: afj
          POSTGRES_DB: afj_core
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U afj -d afj_core"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Frontend install
        run: cd frontend && npm ci
      - name: Frontend type check
        run: cd frontend && npx tsc --noEmit
      - name: Frontend build
        run: cd frontend && npm run build
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.RAILWAY_URL || 'https://su-production-4561.up.railway.app' }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Backend lint (gate real — config em backend/ruff.toml)
        run: cd backend && pip install ruff && ruff check app/
      # ATÉ A RODADA pós-260.5 ESTE PASSO NUNCA EXECUTOU UM TESTE:
      # instalava só pytest/httpx, sem `requirements.txt`, então a coleção
      # morria em `ModuleNotFoundError: structlog`; o `| head` mascarava o
      # código de saída e o `|| true` engolia o resto. ~1.065 testes eram
      # decorativos. Agora as dependências reais são instaladas e o schema
      # é criado, para que a suíte de fato rode.
      - name: Backend install
        run: cd backend && pip install -r requirements.txt -r requirements-dev.txt
      # Schema + seed, exatamente o que a app faz no boot. O seed não é
      # opcional: sem o ADMIN semeado a fixture `auth_headers` chama
      # `pytest.skip`, e um gate sobre teste que pula não protege nada
      # (verificado: contra banco vazio a guarda de LGPD pulava em vez de
      # rodar).
      - name: Backend schema + seed (mesmo caminho do boot da app)
        run: |
          cd backend
          python -c "
          import asyncio
          from sqlalchemy.ext.asyncio import create_async_engine
          from app.db.base import Base
          import app.models  # registra os modelos no metadata
          from app.config import settings
          from app.core.events import _seed_default_data

          async def main():
              engine = create_async_engine(settings.DATABASE_URL)
              async with engine.begin() as conn:
                  await conn.run_sync(Base.metadata.create_all)
              await _seed_default_data(engine)
              await engine.dispose()

          asyncio.run(main())
          "
        env:
          DATABASE_URL: postgresql+asyncpg://afj:afj@localhost:5432/afj_core
      # GATE REAL: 882 testes, verdes contra um Postgres limpo (validado
      # localmente reproduzindo este ambiente exato). Sem `|| true`: se
      # quebrar, o CI reprova.
      - name: Backend unit tests (gate real)
        run: cd backend && python -m pytest tests/test_unit/ -q
        env:
          DATABASE_URL: postgresql+asyncpg://afj:afj@localhost:5432/afj_core
      # GATE REAL: guarda anti-regressão do direito ao esquecimento. Fica
      # num passo próprio (e não no informativo abaixo) porque é a única
      # coisa que impede a 9ª ocorrência da classe de bug mais recorrente
      # do projeto — 8 vezes uma tabela/coluna com dado de titular ficou
      # de fora do erase. Ela cria um titular com token único, esquece e
      # varre o banco inteiro atrás do token.
      - name: Backend LGPD — guarda de esquecimento (gate real)
        run: cd backend && python -m pytest tests/test_api/test_lgpd_sentinela.py -q
        env:
          DATABASE_URL: postgresql+asyncpg://afj:afj@localhost:5432/afj_core
      # GATE REAL desde a fase que zerou o resíduo. Histórico, porque a conta
      # importa: esta suíte saiu de 27 falhas + 75 ERROS (medição inicial,
      # Postgres real) para ZERO falhas, em duas execuções seguidas contra o
      # mesmo banco. Nenhuma das causas estava no código de produto — eram
      # pool de conexão atravessando event loops, a própria suíte estourando
      # o rate limit de login, um teste que colocava o token compartilhado na
      # blacklist, FK fabricada, identificadores fixos e asserções defasadas.
      - name: Backend API tests (gate real)
        run: cd backend && python -m pytest tests/test_api/ -q
        env:
          DATABASE_URL: postgresql+asyncpg://afj:afj@localhost:5432/afj_core
      - name: Frontend tests
        run: cd frontend && npm test -- --run 2>&1 | head -60 || true
      - name: Backend dependency vulnerability scan (informativo, não bloqueia)
        run: |
          cd backend
          pip install pip-audit 2>/dev/null || true
          pip-audit -r requirements.txt 2>&1 | head -100 || true
      - name: Frontend dependency vulnerability scan (informativo, não bloqueia)
        run: cd frontend && npm audit --audit-level=high 2>&1 | head -100 || true
