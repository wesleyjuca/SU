<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>AFJ CORE</title>
  <style>
    html, body { margin: 0; height: 100%; background: #1E2229; color: #F4F0EA;
      font-family: system-ui, sans-serif; }
    .wrap { height: 100%; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 18px; }
    .mark { width: 64px; height: 64px; border-radius: 8px; background: #B8954A;
      color: #fff; display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 22px; letter-spacing: 1px; }
    .spin { width: 22px; height: 22px; border: 3px solid rgba(255,255,255,.2);
      border-top-color: #B8954A; border-radius: 50%; animation: s .8s linear infinite; }
    @keyframes s { to { transform: rotate(360deg); } }
    p { opacity: .55; font-size: 14px; }
  </style>
</head>
<body>
  <!-- Splash local da casca nativa: o app remoto (server.url) assume ao carregar.
       Se ficar visível, verifique a conexão / CAPACITOR_SERVER_URL. -->
  <div class="wrap">
    <div class="mark">AFJ</div>
    <div class="spin"></div>
    <p>Carregando…</p>
  </div>
</body>
</html>
