services:
  - type: web
    name: afj-core-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    # Render injects PORT automatically
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: afj-core-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: CORS_ORIGINS
        value: '["https://afj-core.vercel.app"]'
      # Redis, Qdrant, AI keys — adicionar manualmente no dashboard Render
      # REDIS_URL, QDRANT_URL, ANTHROPIC_API_KEY, OPENAI_API_KEY

databases:
  - name: afj-core-db
    databaseName: afj_core
    user: afj
    plan: free
