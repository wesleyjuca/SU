[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# start.sh sobe Celery worker+beat em background e o uvicorn em foreground —
# sem ele, agentes IA/OCR/alertas de prazo ficam enfileirados sem consumidor.
startCommand = "sh start.sh"
healthcheckPath = "/ping"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
