[pytest]
# `-p no:anyio` — correção da rodada pós-260.5.
#
# O projeto tem os dois plugins async instalados: pytest-asyncio (usado por
# 97 arquivos via `pytest.mark.asyncio` + o `asyncio_mode = auto` abaixo) e
# o plugin que vem junto com o pacote `anyio`, que se registra sozinho e
# reivindica os 38 arquivos marcados com `pytest.mark.anyio`. Com os dois
# ativos, o MESMO teste era coletado pelos dois: o anyio parametrizava por
# backend (daí o sufixo `[asyncio]` nos IDs) e criava um event loop próprio,
# enquanto o engine do SQLAlchemy — singleton de módulo — já estava preso ao
# loop do outro. Resultado: "attached to a different loop" de forma crônica,
# desde a Fase 199, forçando toda verificação de fase a virar script
# standalone por ~25 fases.
#
# Medido na suíte `test_api/` (Postgres real, mesma máquina):
#   com os 2 plugins : 102 falhas /  34 passes / 142 erros / 181s
#   com plugin único :  20 falhas /  90 passes /  78 erros / 101s
#
# Desligamos o do anyio (e não o pytest-asyncio) porque a maioria dos
# arquivos depende do `asyncio_mode = auto`. `pytest.mark.anyio` vira um
# marcador inerte nos 38 arquivos — registrado em `markers` abaixo só para
# não poluir a saída com avisos de marcador desconhecido.
addopts = -p no:anyio
asyncio_mode = auto
testpaths = tests
markers =
    anyio: inerte — mantido só para os 38 arquivos legados que ainda o declaram (ver nota acima)
